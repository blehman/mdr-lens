[project]
name = "mdr-lens"
version = "0.1.0"
description = "Medical Data Review lens: eDISH, AE explorer, site KRIs, and data-quality checks on the public CDISC pilot SDTM study."
requires-python = ">=3.10"
dependencies = [
    "pyreadr>=0.5.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[dependency-groups]
# `uv sync` installs the dev group by default, so CI's `uv run pytest` has pytest.
dev = [
    "pytest>=8.0",
]

[build-system]
# Without a build backend, uv treats the project as virtual and never installs
# the src/mdrlens package, so `scripts/build.py` cannot import it in CI.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdrlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
