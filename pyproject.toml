[project]
name = "mdr-lens"
version = "0.1.0"
description = "Medical Data Review lens: eDISH, AE explorer, site KRIs, and data-quality checks on the public CDISC pilot SDTM study."
requires-python = ">=3.10"
dependencies = [
    "pyreadr>=0.5.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
